spring.application.name=GroiroTechInventory

# === Database (обязательно переопределять через env в продакшене) ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/groiro_tech_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# === Liquibase ===
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# === JWT (ОБЯЗАТЕЛЬНО задать JWT_SECRET в продакшене — минимум 32 байта Base64) ===
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === CORS ===
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# === Server ===
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# === Logging ===
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.liquibase=INFO
logging.level.by.GroiroTechInventory=DEBUG

# === Uploads ===
app.upload-dir=${APP_UPLOAD_DIR:uploads/floor-plans}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.web.resources.add-mappings=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB