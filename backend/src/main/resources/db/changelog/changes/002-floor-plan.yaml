databaseChangeLog:
  - changeSet:
      id: 002-floor-plan
      author: maksimlych
      changes:

        # Фото планов этажей
        - createTable:
            tableName: floor_plans
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: floor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: image_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: original_width
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: original_height
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: floor_plans
            baseColumnNames: floor_id
            referencedTableName: floors
            referencedColumnNames: id
            constraintName: fk_floor_plans_floor
            onDelete: CASCADE

        # Полигоны кабинетов поверх плана
        - createTable:
            tableName: room_polygons
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: points
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: label_x
                  type: DOUBLE PRECISION
              - column:
                  name: label_y
                  type: DOUBLE PRECISION
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: room_polygons
            baseColumnNames: room_id
            referencedTableName: rooms
            referencedColumnNames: id
            constraintName: fk_room_polygons_room
            onDelete: CASCADE